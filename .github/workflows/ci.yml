# Test CI — runs the pytest suite (unit + integration) on every push to
# main and every PR. puffo-agent's tests are self-contained (isolated
# per-test homes, SQLite, a mocked relay), so there's no live-server e2e
# stage and no services to stand up. Structural checks and pytest are the gates.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI jobs only need to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install quality tools
        run: pip install -e ".[dev]"
      - name: repository checks
        # no-commit-to-branch guards local commits; in CI the checkout *is*
        # main on push, so the hook would fail the job for doing its job.
        env:
          SKIP: no-commit-to-branch
        run: pre-commit run --all-files

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen  # the PySide6 UI tests render headless
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      # PySide6 (desktop UI tests) dlopens libEGL/libGL even under the
      # offscreen platform; bare runners don't ship them.
      - name: system libs for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # [dev] pulls pytest + pytest-asyncio; without pytest-asyncio every
      # async test silently skips and the suite passes vacuously.
      - name: install (with dev extras)
        run: pip install -e ".[dev]"

      # Smoke: the console script + CLI load against the installed package.
      - name: smoke — CLI loads
        run: |
          puffo-agent version
          puffo-agent --help > /dev/null

      - name: pytest
        run: timeout --signal=INT --kill-after=30s 8m pytest -vv -p no:warnings
