# Production PyPI publish. Fires when a GitHub Release is published.
# Tag the release `vX.Y.Z` to match the version in pyproject.toml;
# the build picks up the version from pyproject, not the tag, so the
# tag is just a label for humans. Uses Trusted Publishing — no
# secrets stored, OIDC exchange only.
#
# One-time setup on pypi.org:
#
#   1. Sign in at pypi.org.
#   2. Account settings → Publishing → "Add a new pending publisher".
#   3. PyPI project name: puffo-agent
#      Owner:               puffo-ai
#      Repository name:     puffo-agent
#      Workflow filename:   publish-pypi.yml
#      Environment name:    pypi
#   4. Save. After the first successful run the publisher converts
#      from "pending" to a real one.
#
# Strongly recommended: in repo Settings → Environments → pypi, add a
# "Required reviewers" rule so the upload step waits on a manual
# approval before publishing. Once a version is on PyPI it can never
# be re-uploaded — the approval gate is the last cheap chance to
# catch a bad build.
#
# The build runs in its own job *before* the gate and uploads dist/ as a
# workflow artifact; the gated publish job uploads exactly those bytes.
# Approvers can download the artifact and compare the SHA256 lines in the
# build job summary before approving, instead of approving a build that
# has not happened yet.
#
# Run it manually ("Run workflow", pick a tag or branch) to rehearse the
# build. Manual runs never publish: the publish job only runs for a
# published Release.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify stable version and release tag
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib

          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit(
                  f"Production PyPI accepts stable versions only; got {version!r}"
              )
          if tag != f"v{version}":
              raise SystemExit(
                  f"Release tag {tag!r} does not match pyproject version {version!r}"
              )
          PY

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Smoke-install the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/puffo-agent --help > /dev/null

      - name: Record artifact hashes
        run: |
          {
            echo "### dist/ for ${GITHUB_REF_NAME} @ ${GITHUB_SHA}"
            echo '```'
            (cd dist && sha256sum -- *)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/puffo-agent
    permissions:
      id-token: write
    steps:
      - name: Download the built dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Show what is being published
        run: cd dist && sha256sum -- *

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
